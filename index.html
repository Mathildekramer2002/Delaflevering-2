<!DOCTYPE html>
<html lang="da">
  <head>
    <meta char  ="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spilcaféen</title>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/booking.css" />
    <link
      rel="shortcut icon"
      href="https://images.squarespace-cdn.com/content/v1/61fd2c9026a58c435d260f4c/1af90772-e642-4309-a2cb-f4161e36855e/SC-logo-2023-transparant-BG+Small+Crop.png"
      type="image/logo"
    />
  </head>
  <body>
    <header class="topbar">
      <!-- Øverste mørkebrune bjælke -->
      <div class="topbar-bar"></div>
        <img src="images/logo.webp" 
        alt="Spilcaféen logo" 
        class="header-logo" 
      />
    </header>
   

    <!-- BOOKING FLOW (skjult indtil man trykker "Reserver bord") -->
<section id="booking-view" class="booking" hidden>
  <div id="booking-stage" class="booking-stage"></div>
</section>

  <main class="page">

    <!-- Giver søgefeltet et navn til skærmlæsere. -->
    <div class="searchbar">
          <label for="search-input" class="sr-only">Søg efter spil</label>
      <input type="text" id="search-input" placeholder="Søg" />
        <span class="icon-btn" aria-hidden="true">
          <img src="images/lup.png" alt="">
        </span>
    </div>
  
    <!-- 👇 NY placering af filtre + Ryd filtre -->
    <div class="filterbar">
      <div class="filters-row">
        <!-- alle dine filter-dropdowns flyttes herned -->
        <div class="filter-dropdown">
          <button class="pill">Kategori ⌄</button>
          <div class="dropdown-menu">
            <button data-filter="genre" data-value="Familie">Familie</button>
            <button data-filter="genre" data-value="Kortspil">Kortspil</button>
            <button data-filter="genre" data-value="Strategi">Strategi</button>
            <button data-filter="genre" data-value="Ordspil">Ordspil</button>
            <button data-filter="genre" data-value="Party">Party</button>
            <button data-filter="genre" data-value="Andre">Andre</button>
            <button data-filter="genre" data-value="all">Alle kategorier</button>
          </div>
        </div>
  
        <div class="filter-dropdown">
          <button class="pill">Spillere ⌄</button>
          <div class="dropdown-menu">
            <button data-filter="players" data-value="1-2">1–2</button>
            <button data-filter="players" data-value="2-4">2–4</button>
            <button data-filter="players" data-value="4-6">4–6</button>
            <button data-filter="players" data-value="6-10">6–10</button>
            <button data-filter="players" data-value="10+">10+</button>
            <button data-filter="players" data-value="all">Alle</button>
          </div>
        </div>
  
        <div class="filter-dropdown">
          <button class="pill">Alder ⌄</button>
          <div class="dropdown-menu">
            <button data-filter="age" data-value="3">3+</button>
            <button data-filter="age" data-value="6">6+</button>
            <button data-filter="age" data-value="8">8+</button>
            <button data-filter="age" data-value="10">10+</button>
            <button data-filter="age" data-value="12">12+</button>
            <button data-filter="age" data-value="15">15+</button>
            <button data-filter="age" data-value="18">18+</button>
            <button data-filter="age" data-value="all">Alle</button>
          </div>
        </div>
  
        <div class="filter-dropdown">
          <button class="pill">Varighed ⌄</button>
          <div class="dropdown-menu">
            <button data-filter="duration" data-value="0-15">≤ 15 min</button>
            <button data-filter="duration" data-value="15-30">15–30 min</button>
            <button data-filter="duration" data-value="30-60">30–60 min</button>
            <button data-filter="duration" data-value="60-120">60–120 min</button>
            <button data-filter="duration" data-value="120+">120+ min</button>
            <button data-filter="duration" data-value="all">Alle</button>
          </div>
        </div>
  
      </div>
  
      <!-- Sortering og nulstilling af filtre -->
      <div class="filter-actions">
        <div class="filter-dropdown sort-dropdown">
          <button class="pill" id="sort-button" type="button">
            Sorter efter ⌄
          </button>
    
          <div class="dropdown-menu">
            <button data-sort-value="rating">Populære</button>
            <button data-sort-value="title">A–Å</button>
            <button data-sort-value="none">Nyeste</button>
          </div>
        </div>
    
        <button class="clear-pill" id="clear-filters-pill" type="button">
          Ryd filtre
        </button>

        <!-- Giver skærmlæseren besked, når der sker en ændring. -->
        <p id="filter-feedback" class="sr-only" aria-live="polite"></p>

      </div>
    </div>
  
    <!-- resten af indholdet -->
    <section id="game-list" class="card-grid"></section>
  </main>

    

      <!-- Skjult lager til select/inputs som koden bruger (ikke synligt for brugeren) -->
      <div class="filters-storage" hidden>
        <select id="genre-select">
          <option value="all">Alle kategorier</option>
        </select>
        <select id="language-select">
          <option value="all">Alle sprog</option>
        </select>
        <select id="difficulty-select">
          <option value="all">Alle sværhedsgrader</option>
        </select>
    
      
        <select id="sort-select">
          <option value="none">Ingen sortering</option>
          <option value="title">Titel (A-Å)</option>
          <option value="playtime">Varighed (kortest først)</option>
          <option value="rating">Rating (højeste først)</option>
        </select>
      
        <!-- eksisterende clear-knap er ikke længere synlig, men kan gerne blive -->
        <button id="clear-filters" type="button">Ryd (skjult)</button>
      </div>


<!-- Modal: stort kort -->
<div id="game-modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <article class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" data-close aria-label="Luk">×</button>

    <div class="modal-media">
      <img id="modal-image" alt="">
    </div>

    <div class="modal-body">
      <h2 id="modal-title"></h2>
      <div class="modal-meta" id="modal-meta"></div>
      <p id="modal-desc"></p>
      <div class="modal-details" id="modal-details"></div>

      <!-- NY REGELSEKTION -->
      <section id="modal-rules-wrap" class="modal-rules" hidden>
        <button id="rules-toggle" class="rules-btn" aria-expanded="false">▸ Regler</button>
        <div id="rules-content" class="rules-content">
          <pre id="modal-rules"></pre>
        </div>
      </section>
    </div>
  </article>
</div>

    <!-- Bundnavigation som i mockup -->
    <nav class="tabbar tabbar--fab">
  <button class="tab" id="tab-all">
    <span>🎮</span><small>Alle spil</small>
  </button>

  <button class="tab" id="tab-reserve">
    <span>📅</span><small>Reserver bord</small>
  </button>

  <!-- den runde, forhøjede hjem-knap -->
  <button class="home-fab" id="tab-home" aria-label="Hjem">🏠</button>

  <button class="tab" id="filter-favourites">
    <span>❤️️</span><small>Favoritter</small>
  </button>

  <button class="tab" id="tab-profile">
    <span>👤</span><small>Profil</small>
  </button>
</nav>


    <footer class="legal">© Spilcaféen</footer>

  <script src="js/booking.js"></script>
  <script src="js/app.js"></script>
  
  </body>
</html>
