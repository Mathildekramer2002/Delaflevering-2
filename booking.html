<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book bord | Spilcaféen</title>

    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/booking.css">

    <link rel="shortcut icon"
        href="https://images.squarespace-cdn.com/content/v1/61fd2c9026a58c435d260f4c/1af90772-e642-4309-a2cb-f4161e36855e/SC-logo-2023-transparant-BG+Small+Crop.png"
        type="image/logo">
</head>

<body>

    <!-- Booking -->
    <main>

        <section id="booking-view" class="booking">

            <div id="booking-stage" class="booking-stage"></div>

        </section>

    </main>


    <!-- Bundnavigation -->
    <nav class="tabbar" aria-label="Hovednavigation">
    
        <button class="tab" id="tab-home" type="button" onclick="window.location.href='index.html'">
            <img src="images/home.svg" alt="">
            <small>Hjem</small>
        </button>
    
        <button class="tab" id="tab-all" type="button" onclick="window.location.href='spil.html'">
            <img src="images/games.svg" alt="">
            <small>Alle spil</small>
        </button>
    
        <button class="tab" id="filter-favourites" type="button" onclick="window.location.href='favoritter.html'">
            <img src="images/heart.svg" alt="">
            <small>Favoritter</small>
        </button>
    
        <button class="tab" id="tab-reserve" type="button" onclick="window.location.href='booking.html'">
            <img src="images/book.svg" alt="">
            <small>Book bord</small>
        </button>
    
        <button class="tab" id="tab-profile" type="button">
            <img src="images/profil.svg" alt="">
            <small>Profil</small>
        </button>
    
    </nav>

    <script src="js/booking.js"></script>

</body>

</html>
